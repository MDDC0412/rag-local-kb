# 一条命令起整套：nginx（对外 8080） + uvicorn（容器内 8000）
#
# 部署流程分两步（前端不再在服务器上构建）：
#   1. 开发机：执行 scripts/package_release.ps1，产出 release/ 下两个压缩包
#   2. 服务器：解压后执行 docker compose up -d
#
# 若要在服务器上直接构建，需先准备两样东西：
#   - frontend/dist：由开发机的 pnpm build 生成（打包脚本已包含）
#   - 可访问 PyPI 的镜像源，或本地 wheel 缓存（后端 Dockerfile 用 PIP_INDEX_URL）
#
# 服务器根目录 .env（与 docker-compose.yml 同级，可选）：
#   APP_PUBLIC_ORIGIN=http://your-server-ip:8080
#   PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple
#   HTTP_PROXY= / HTTPS_PROXY= / NO_PROXY=     # 仅构建期生效
#
# APP_* 变量写入容器运行时环境；PIP_INDEX_URL 与代理变量只在构建期作为 build.args 使用。

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
    image: rag-backend:latest
    container_name: rag-backend
    restart: unless-stopped
    # 必须单进程：Chroma 嵌入式库多进程会丢写入（见 docs/HANDOVER.md §7.1）
    command:
      ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TZ: Asia/Shanghai
      APP_DATA_DIR: /data
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # 容器里没有系统代理，显式直连，免得上游代理把请求吞掉
      APP_HTTP_PROXY: direct
      APP_CORS_ORIGINS: ${APP_PUBLIC_ORIGIN:-http://127.0.0.1:8080},http://localhost:8080
    volumes:
      - ./data:/data
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    # 只打包已构建好的 dist，构建期不安装任何依赖
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: rag-frontend:latest
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
