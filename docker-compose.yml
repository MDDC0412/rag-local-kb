# 一条命令起整套：nginx（对外 8080） + uvicorn（容器内 8000）
#
# 用法：
#   docker compose up --build
#   → http://127.0.0.1:8080
#
# 数据落在 ./data（宿主机），容器删了数据还在。

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-backend
    restart: unless-stopped
    # 必须单进程：Chroma 嵌入式库多进程会丢写入（见 HANDOVER §7.1）
    command:
      ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TZ: Asia/Shanghai
      APP_DATA_DIR: /data
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # 容器里没有系统代理，显式直连，免得上游代理把请求吞掉
      APP_HTTP_PROXY: direct
      APP_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
    volumes:
      - ./data:/data
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy