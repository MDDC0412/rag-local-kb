# 生产部署配置：只引用镜像，不包含构建段。
#
# 镜像由 GitHub Actions 构建并推送至 GHCR（.github/workflows/docker.yml），
# 部署机只负责拉取与运行，不参与构建，宿主机无需 Node、Python 或包管理器。
#
# 部署：
#     docker compose pull
#     docker compose up -d
#
# 可选变量（写在同目录 .env 中）：
#     APP_PUBLIC_ORIGIN=http://服务器IP:8080   跨域白名单
#
# 本地开发构建请使用叠加文件：
#     docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  backend:
    image: ghcr.io/mddc0412/rag-local-kb/backend:latest
    container_name: rag-backend
    restart: unless-stopped
    # 必须单进程：Chroma 嵌入式库多进程会丢写入（见 docs/HANDOVER.md §7.1）
    command:
      ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TZ: Asia/Shanghai
      APP_DATA_DIR: /data
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      # 容器内无代理，显式直连，避免上游代理吞掉请求
      APP_HTTP_PROXY: direct
      APP_CORS_ORIGINS: ${APP_PUBLIC_ORIGIN:-http://127.0.0.1:8080},http://localhost:8080
    volumes:
      - ./data:/data
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ghcr.io/mddc0412/rag-local-kb/frontend:latest
    container_name: rag-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
