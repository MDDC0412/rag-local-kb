[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # 中文标点全角，误报多
    "RUF002",
    "RUF003",
    "B008",    # FastAPI 的 Depends() 默认值写法
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# 样例文档的中文长句不能为了行宽折断，否则展示出来的排版就不真实了
"app/services/chunk_samples.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: 需要真实外部 API 的测试，默认跳过",
]
addopts = "-q -m 'not integration'"
asyncio_default_fixture_loop_scope = "function"